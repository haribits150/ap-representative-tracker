<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Representative Tracker — Know what your MP did in office</title>
<meta name="description" content="Nonpartisan, sourced performance metrics for Andhra Pradesh's elected representatives, from public data only.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#/">AP Representative Tracker</a>
    <nav class="main-nav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/compare" data-nav="compare">Compare</a>
      <a href="#/learn" data-nav="learn">MP vs MLA</a>
      <a href="#/glossary" data-nav="glossary">Glossary</a>
      <a href="#/methodology" data-nav="methodology">Methodology</a>
    </nav>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="lang-en" class="active">English</button>
      <button id="lang-reg">తెలుగు</button>
    </div>
    <div class="lang-toggle" role="group" aria-label="State">
      <button class="state-pill" data-state="ap" onclick="setState('ap')">AP</button>
      <button class="state-pill" data-state="tg" onclick="setState('tg')">TG</button>
      <button class="state-pill" data-state="tn" onclick="setState('tn')">TN</button>
      <button class="state-pill" data-state="ka" onclick="setState('ka')">KA</button>
    </div>
  </div>
</header>
<main id="app" class="wrap"></main>
<footer class="site-footer">
  <div class="wrap">
    <p id="footer-note"></p>
    <p><a href="#/changelog" id="footer-changelog">Changelog</a> &middot;
       <a href="#" id="lite-toggle">Lite mode</a></p>
    <p class="disclaimer" id="footer-disclaimer"></p>
  </div>
</footer>
<script src="js/i18n.js"></script>
<script src="js/i18n_ta.js"></script>
<script src="js/i18n_ka.js"></script>
<script src="js/content_ta.js"></script>
<script src="js/content_ka.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="js/app.js"></script>
</body>
</html>
